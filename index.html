<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Văn Đạo - Đại Bách Khoa Toàn Thư Văn Học Việt Nam. Vẻ đẹp bạch ngọc giữa làn nước tĩnh.">
    <meta name="theme-color" content="#fdfbf7">

    <title>Văn Đạo | Đại Bách Khoa Toàn Thư</title>

    <!-- ========================================== -->
    <!-- KHAI BÁO PWA & ICONS (Trỏ đúng vào thư mục assets) -->
    <!-- ========================================== -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="alternate icon" type="image/x-icon" href="assets/favicon.ico">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Văn Đạo">

    <!-- ========================================== -->
    <!-- PRELOAD FONTS (Tối ưu tốc độ)              -->
    <!-- ========================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">

    <!-- ========================================== -->
    <!-- GỌI CÁC FILE CSS (Đúng thứ tự ưu tiên)     -->
    <!-- ========================================== -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layouts.css">
    <link rel="stylesheet" href="css/reader.css">
</head>

<body class="loading">

    <!-- ========================================== -->
    <!-- 1. MÀN HÌNH CHỜ (SPLASH SCREEN)            -->
    <!-- Nội dung (Ảnh, Danh ngôn) sẽ do JS đổ vào  -->
    <!-- ========================================== -->
    <div id="splash-screen">
        <!-- Nội dung HTML ở đây sẽ được sinh ra bởi js/main.js -->
    </div>


    <!-- ========================================== -->
    <!-- 2. THANH ĐIỀU HƯỚNG TRÊN CÙNG (HEADER)      -->
    <!-- ========================================== -->
    <header id="app-header">
        <!-- Logo (Bấm vào để về trang chủ) -->
        <a href="#/home" class="header-logo" onclick="window.navigateTo('home')">Văn Đạo</a>

        <!-- Các nút chức năng bên phải -->
        <div class="header-actions">
            <!-- Nút Tìm kiếm -->
            <button id="btn-search" aria-label="Tìm kiếm">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
            
            <!-- Nút Cài đặt (Gear icon) -->
            <button id="btn-settings" aria-label="Cài đặt">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
            
            <!-- Nút Menu (Chỉ dùng cho Mobile) -->
            <button id="btn-menu" aria-label="Menu">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
        </div>
    </header>


    <!-- ========================================== -->
    <!-- 3. THANH TÌM KIẾM (ẨN/HIỆN BẰNG JS)        -->
    <!-- ========================================== -->
    <div id="search-container" style="display: none;">
        <input type="text" id="search-input" placeholder="Tìm tên tác phẩm, tác giả (không cần dấu)..." autocomplete="off">
        <div id="search-results"></div>
    </div>


    <!-- ========================================== -->
    <!-- 4. KHUNG CHỨA NỘI DUNG CHÍNH (CÁC VIEW)    -->
    <!-- ========================================== -->
    <main id="app-content">
        
        <!-- View 1: Trang Chủ -->
        <section id="view-home" class="view active">
            <!-- Nội dung sẽ do js/render.js đổ vào -->
        </section>

        <!-- View 2: Trang Đọc Bài Thơ / Tác Phẩm -->
        <section id="view-detail" class="view">
            <!-- Nội dung sẽ do js/render.js đổ vào -->
        </section>

        <!-- View 3: Trang Chi Tiết Tác Giả -->
        <section id="view-author" class="view">
            <!-- Nội dung sẽ do js/render.js đổ vào -->
        </section>

        <!-- View 4: Trang Lý Thuyết / Thi Pháp -->
        <section id="view-theory" class="view">
            <!-- Nội dung sẽ do js/render.js đổ vào -->
        </section>

    </main>


    <!-- ========================================== -->
    <!-- 5. MODAL CÀI ĐẶT (BẬT LÊN TỪ NÚT GEAR)     -->
    <!-- ========================================== -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Cài đặt</h2>
                <button class="btn-close-modal" id="btn-close-settings" aria-label="Đóng">&times;</button>
            </div>
            
            <div class="modal-body">
                <h3 class="settings-section-title">DỮ LIỆU & LƯU TRỮ</h3>
                
                <div class="settings-group">
                    <div class="settings-group-header">
                        <strong class="settings-label">Tủ Sách Offline</strong>
                        <!-- Dung lượng sẽ được js/offline.js cập nhật tự động -->
                        <span id="storage-text" class="storage-info">Đang kiểm tra...</span>
                    </div>
                    <p class="settings-desc">Mang thư viện tri thức theo bên mình, kể cả khi không có kết nối mạng.</p>
                    
                    <!-- Nút tải toàn bộ -->
                    <button id="btn-download-all" class="btn btn-primary btn-block">TẢI TOÀN BỘ</button>
                    
                    <!-- Thanh tiến trình (Ẩn mặc định, JS sẽ bật lên) -->
                    <div class="vd-progress-container" id="progress-container" style="display: none;">
                        <div class="vd-progress-bar" id="progress-bar"></div>
                    </div>
                    <span class="vd-progress-text" id="progress-text" style="display: none;">0%</span>
                </div>

                <div class="settings-danger-zone">
                    <button id="btn-clear-cache" class="btn-danger-text">
                        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                        Xóa dữ liệu Offline
                    </button>
                </div>
            </div>
        </div>
    </div>


    <!-- ========================================== -->
    <!-- 6. BOTTOM NAVIGATION (CHỈ HIỆN TRÊN MOBILE) -->
    <!-- ========================================== -->
    <nav id="bottom-nav">
        <a href="#/home" class="nav-item active" data-target="home" onclick="window.navigateTo('home')">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Trang Chủ</span>
        </a>
        <a href="#/van-hien" class="nav-item" data-target="van-hien" onclick="window.navigateTo('home')">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
            <span>Văn Hiến</span>
        </a>
        <a href="#/bach-khoa" class="nav-item" data-target="bach-khoa" onclick="window.navigateTo('home')">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
            <span>Bách Khoa</span>
        </a>
        <a href="#/thi-phap" class="nav-item" data-target="thi-phap" onclick="window.navigateTo('home')">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
            <span>Thi Pháp</span>
        </a>
    </nav>


    <!-- ========================================== -->
    <!-- 7. GỌI FILE JAVASCRIPT CHÍNH (MODULE)      -->
    <!-- ========================================== -->
    <!-- Bắt buộc phải có type="module" để chạy import/export ES6 -->
    <script type="module" src="js/main.js"></script>

</body>
</html>
