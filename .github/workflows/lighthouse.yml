name: Lighthouse CI
on: [push]
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit URLs using Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://<TÊN_GITHUB_CỦA_BẠN>.github.io/van_hien/
          budgetPath: ./budget.json # Tùy chọn: file cấu hình điểm tối thiểu
