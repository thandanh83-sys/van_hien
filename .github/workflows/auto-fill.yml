name: Auto Fill Missing Content

on:
  # CHỈ KÍCH HOẠT BẰNG TAY (Bấm nút trên GitHub), không tự chạy khi push code
  workflow_dispatch:

concurrency:
  group: git-push-group
  cancel-in-progress: false

jobs:
  fill-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run auto fill script
        run: python tools/auto_fill_content.py

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and Push
        if: steps.git-check.outputs.changes == 'true'
        uses: EndBug/add-and-commit@v11
        with:
          message: "chore: auto fill missing content for works"
          push_attempts: 5 
          default_author: github_actions
