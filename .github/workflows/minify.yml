name: Minify Code
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: git-push-group
  cancel-in-progress: false

jobs:
  minify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Minify HTML, CSS, JS
        uses: anthonyftwang/minify-action@v1
