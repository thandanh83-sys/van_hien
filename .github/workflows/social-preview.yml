name: Generate OG Images
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: og-image-group
  cancel-in-progress: false

jobs:
  og-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate OG Image
        uses: BoyWithSilverWings/generate-og-image-action@v1
        with:
          input-directory: './data/tac-pham'
          output-directory: './assets/og-images'
