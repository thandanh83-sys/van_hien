# =====================================================================
# VĂN ĐẠO ENGINE - GITHUB ACTION: DEPLOY TO GITHUB PAGES (BULLETPROOF)
# Tên file: .github/workflows/deploy.yml
# Version: 7.0.0 (Minify Data + Peaceiris v4)
# =====================================================================
# Tác giả: Văn Đạo
#
# TRIẾT LÝ THIẾT KẾ:
# 1. TỐI ƯU HÓA DUNG LƯỢNG (MINIFY):
#    Trước khi deploy, tự động chạy minify_data.py để nén JSON.
# 2. TRÁNH LỖI "No artifacts named github-pages":
#    Dùng peaceiris/actions-gh-pages@v4 (Tiêu chuẩn vàng, ổn định).
# 3. XẾP HÀNG + HỦY THÔNG MINH:
#    Dùng group "gh-pages-deploy" với cancel-in-progress: true để
#    luôn deploy bản mới nhất, không bị kẹt hàng đợi.
# 4. PRE-FLIGHT CHECK:
#    Verify các file tối thiểu (index.html, sw.js...) trước khi deploy.
# =====================================================================

name: Deploy to GitHub Pages

# =====================================================================
# 1. ĐIỀU KIỆN KÍCH HOẠT (TRIGGERS)
# =====================================================================
on:
  push:
    branches: ["main"]
  workflow_dispatch:

# =====================================================================
# 2. QUYỀN HẠN CỦA BOT (PERMISSIONS)
# =====================================================================
permissions:
  contents: write

# =====================================================================
# 3. QUẢN LÝ XUNG ĐỘT (CONCURRENCY)
# =====================================================================
concurrency:
  group: "gh-pages-deploy"
  cancel-in-progress: true

# =====================================================================
# 4. BIẾN MÔI TRƯỜNG DÙNG CHUNG
# =====================================================================
env:
  PUBLISH_BRANCH: 'gh-pages'
  PUBLISH_DIR: './'
  PYTHON_VERSION: '3.10'

# =====================================================================
# 5. CÁC BƯỚC THỰC THI (JOBS)
# =====================================================================
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # -----------------------------------------------------------------
      # BƯỚC 1: LẤY CODE TỪ KHO VỀ MÁY ẢO
      # -----------------------------------------------------------------
      - name: '1. Checkout (Lấy code)'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # -----------------------------------------------------------------
      # BƯỚC 2: CÀI ĐẶT PYTHON (Để chạy script nén)
      # -----------------------------------------------------------------
      - name: '2. Set up Python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # -----------------------------------------------------------------
      # BƯỚC 3: NÉN TOÀN BỘ DỮ LIỆU JSON (MINIFY)
      # -----------------------------------------------------------------
      # Chạy script minify_data.py để giảm 40-50% dung lượng file JSON
      # trước khi đẩy lên mạng. Giúp web tải nhanh hơn.
      - name: '3. Minify JSON Data (Tối ưu dung lượng)'
        run: python tools/minify_data.py

      # -----------------------------------------------------------------
      # BƯỚC 4: VERIFY ENVIRONMENT (Kiểm tra môi trường)
      # -----------------------------------------------------------------
      - name: '4. Verify environment'
        run: |
          echo "=== Thông tin môi trường ==="
          echo "Workspace: ${{ github.workspace }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo ""
          echo "=== Cấu trúc thư mục gốc (tóm tắt) ==="
          ls -la | head -n 25

      # -----------------------------------------------------------------
      # BƯỚC 5: PRE-FLIGHT CHECK (Kiểm tra file tối thiểu)
      # -----------------------------------------------------------------
      - name: '5. Preflight check'
        id: preflight
        run: |
          echo "=== Preflight check ==="
          MISSING_CRITICAL=0
          MISSING_WARN=0

          # File bắt buộc (FAIL nếu thiếu)
          if [ ! -f "index.html" ]; then
            echo "❌ CRITICAL: Thiếu index.html — KHÔNG THỂ deploy."
            MISSING_CRITICAL=$((MISSING_CRITICAL + 1))
          else
            echo "✅ index.html tồn tại."
          fi

          # File khuyến nghị (WARNING nếu thiếu)
          for FILE in "manifest.json" "sw.js" ".nojekyll" \
                      "data/manifests/static-assets.json" \
                      "data/manifests/agents-manifest.json"; do
            if [ ! -f "$FILE" ]; then
              echo "⚠️  WARNING: Thiếu $FILE (không chặn deploy)."
              MISSING_WARN=$((MISSING_WARN + 1))
            else
              echo "✅ $FILE tồn tại."
            fi
          done

          echo "missing_critical=$MISSING_CRITICAL" >> $GITHUB_OUTPUT
          echo "missing_warn=$MISSING_WARN" >> $GITHUB_OUTPUT

          if [ $MISSING_CRITICAL -gt 0 ]; then
            exit 1
          fi

      # -----------------------------------------------------------------
      # BƯỚC 6: TẠO FILE .NOJEKYLL
      # -----------------------------------------------------------------
      - name: '6. Create .nojekyll file'
        run: |
          touch .nojekyll
          echo "✅ Đã tạo file .nojekyll (rỗng)."

      # -----------------------------------------------------------------
      # BƯỚC 7: DEPLOY LÊN NHÁNH GH-PAGES
      # -----------------------------------------------------------------
      # [NÂNG CẤP] peaceiris/actions-gh-pages@v4 để xóa cảnh báo Node.js 20
      - name: '7. Deploy to gh-pages branch'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.PUBLISH_DIR }}
          publish_branch: ${{ env.PUBLISH_BRANCH }}
          commit_message: "deploy: ${{ github.event.head_commit.message || 'manual deploy' }}"

      # -----------------------------------------------------------------
      # BƯỚC 8: SUMMARY (Báo cáo)
      # -----------------------------------------------------------------
      - name: '8. Summary'
        if: always()
        run: |
          REPO="${{ github.repository }}"
          OWNER=$(echo "$REPO" | cut -d'/' -f1)
          REPO_NAME=$(echo "$REPO" | cut -d'/' -f2)
          PAGES_URL="https://${OWNER}.github.io/${REPO_NAME}/"

          {
            echo "## 🚀 Văn Đạo Deploy to GitHub Pages"
            echo ""
            echo "| Hạng mục | Giá trị |"
            echo "|---|---|"
            echo "| Trạng thái | \`${{ job.status }}\` |"
            echo "| Commit SHA | \`${{ github.sha }}\` |"
            echo "| Trigger bởi | \`${{ github.event_name }}\` |"
            echo "| URL dự kiến | [$PAGES_URL]($PAGES_URL) |"
            echo ""
            echo "### Preflight check"
            echo "- File bắt buộc thiếu: \`${{ steps.preflight.outputs.missing_critical || 'N/A' }}\`"
            echo "- File khuyến nghị thiếu: \`${{ steps.preflight.outputs.missing_warn || 'N/A' }}\`"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "### ✅ Deploy thành công"
              echo "Web mới nhất đã có tại: **[$PAGES_URL]($PAGES_URL)**"
              echo ""
              echo "> ⏱️ GitHub Pages có thể mất 30-60 giây để CDN cập nhật."
            else
              echo "### ❌ Deploy thất bại"
              echo "Hãy kiểm tra log bước 7 (Deploy) để xem chi tiết."
            fi
          } >> $GITHUB_STEP_SUMMARY
