# =====================================================================
# VĂN ĐẠO ENGINE - GITHUB ACTION: TỰ ĐỘNG TRIỂN KHAI LÊN GITHUB PAGES
# Tên file: .github/workflows/deploy.yml
# Phiên bản: 3.0 (Consolidated & Bulletproof)
# Tác giả: Văn Đạo
# 
# TRIẾT LÝ THIẾT KẾ (DESIGN PHILOSOPHY):
# - Khai thiên lập địa: Nhận lấy toàn bộ tinh hoa (code, data, assets) 
#   và hiển thị nó ra thế giới qua GitHub Pages.
# - Bất khả xâm phạm: Quá trình deploy không bao giờ được phép hủy ngang 
#   (cancel-in-progress: false). Nếu đang deploy mà có code mới, bot sẽ 
#   đợi lần cũ xong mới chạy lần mới. Tránh tình trạng web bị "nửa nọ nửa kia".
# - Toàn vẹn: Gom TẤT CẢ các bước (Checkout -> Setup -> Upload -> Deploy) 
#   vào CHUNG MỘT JOB. Đây là chìa khóa để tránh lỗi "No artifacts found".
# - Bảo mật tuyệt đối: Chỉ cấp các quyền tối thiểu cần thiết (đọc code, 
#   ghi lên Pages, tạo token xác thực).
# =====================================================================

name: Deploy to GitHub Pages

# =====================================================================
# 1. ĐIỀU KIỆN KÍCH HOẠT (TRIGGERS)
# =====================================================================
on:
  push:
    branches: [ "main" ] # Chỉ chạy khi push lên nhánh main (nhánh chính)
  
  # Nút bấm thủ công trên tab Actions để bạn có thể deploy lại bất cứ lúc nào
  # mà không cần tạo commit mới.
  workflow_dispatch:

# =====================================================================
# 2. QUYỀN HẠN CỦA BOT (PERMISSIONS)
# =====================================================================
# Tuân thủ nguyên tắc "Đặc quyền tối thiểu" (Principle of Least Privilege).
permissions:
  contents: read  # Chỉ được phép đọc code trong kho, không được sửa
  pages: write    # Được phép ghi (deploy) lên GitHub Pages
  id-token: write # Cấp quyền tạo token xác thực (OpenID Connect) để GitHub Pages tin tưởng

# =====================================================================
# 3. QUẢN LÝ XUNG ĐỘT (CONCURRENCY)
# =====================================================================
concurrency:
  group: "pages" # Gom tất cả các lần deploy vào chung một nhóm tên là "pages"
  
  # TUYỆT ĐỐI KHÔNG HỦY NGANG (cancel-in-progress: false).
  # Nếu đang deploy mà bạn push thêm code, bot sẽ đợi lần deploy cũ chạy xong 
  # mới chạy lần mới. 
  # Việc hủy ngang giữa chừng có thể khiến web bị lỗi "nửa nọ nửa kia" 
  # hoặc trắng trang do thiếu file.
  cancel-in-progress: false 

# =====================================================================
# 4. CÁC BƯỚC THỰC THI (JOBS)
# =====================================================================
jobs:
  # CHỈ CÓ DUY NHẤT MỘT JOB (Gộp chung mọi thứ để đảm bảo tính toàn vẹn)
  deploy:
    # Khai báo môi trường là github-pages và lấy đường link URL sau khi deploy thành công
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    # Chạy trên máy ảo Ubuntu mới nhất của GitHub
    runs-on: ubuntu-latest
    
    # KỶ LUẬT THỜI GIAN: Tự động hủy nếu chạy quá 10 phút.
    timeout-minutes: 10
    
    steps:
      # -----------------------------------------------------------------
      # BƯỚC 1: LẤY CODE TỪ KHO VỀ MÁY ẢO
      # -----------------------------------------------------------------
      - name: 1. Checkout (Lấy code về)
        uses: actions/checkout@v4
        with:
          # Chỉ cần lấy code mới nhất (fetch-depth: 1) để deploy.
          # Không cần lấy toàn bộ lịch sử commit, giúp quá trình checkout nhanh hơn.
          fetch-depth: 1

      # -----------------------------------------------------------------
      # BƯỚC 2: CẤU HÌNH GITHUB PAGES
      # -----------------------------------------------------------------
      - name: 2. Setup Pages (Cấu hình Pages)
        uses: actions/configure-pages@v5
        # Tự động lấy các thông số cấu hình (như tên miền, base path) của GitHub Pages 
        # để chuẩn bị cho quá trình build. Đảm bảo các file CSS/JS trỏ đúng đường dẫn.

      # -----------------------------------------------------------------
      # BƯỚC 3: (TÙY CHỌN) TẠO FILE .NOJEKYLL TỰ ĐỘNG
      # -----------------------------------------------------------------
      # GitHub Pages mặc định chạy Jekyll, có thể bỏ qua các file bắt đầu bằng dấu gạch dưới.
      # Bước này tự động tạo file .nojekyll để báo cho GitHub Pages biết: 
      # "Đừng can thiệp vào cấu trúc thư mục của tôi".
      - name: 3. Create .nojekyll file (Bảo vệ cấu trúc thư mục)
        run: touch .nojekyll

      # -----------------------------------------------------------------
      # BƯỚC 4: ĐÓNG GÓI DỰ ÁN (UPLOAD ARTIFACT) - BƯỚC SỐNG CÒN
      # -----------------------------------------------------------------
      - name: 4. Upload artifact (Đóng gói dự án)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 
          # Dấu chấm ('.') có nghĩa là lấy TOÀN BỘ file ở thư mục gốc 
          # (index.html, css/, js/, data/, assets/...)
          # Action này sẽ nén chúng lại thành một gói (artifact) tên là "github-pages"
          # và lưu tạm trên máy chủ GitHub.

      # -----------------------------------------------------------------
      # BƯỚC 5: XUẤT BẢN LÊN WEB (DEPLOY)
      # -----------------------------------------------------------------
      - name: 5. Deploy to GitHub Pages (Xuất bản lên web)
        id: deployment # Đặt ID để lấy được cái URL ở phần 'environment' phía trên
        uses: actions/deploy-pages@v4
        # Bung gói artifact vừa nén ở Bước 4 ra và đưa lên máy chủ GitHub Pages.
        # Nhờ việc gộp chung vào 1 Job, bot `deploy-pages` sẽ tìm thấy artifact 
        # ngay lập tức, khắc phục hoàn toàn lỗi "No artifacts named...".
