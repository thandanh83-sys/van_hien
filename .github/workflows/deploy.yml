# =====================================================================
# VĂN ĐẠO ENGINE - GITHUB ACTION: DEPLOY TO GITHUB PAGES (BULLETPROOF)
# Tên file: .github/workflows/deploy.yml
# Phiên bản: 5.0 (Peaceiris Engine - Không dùng Artifact)
# 
# TRIẾT LÝ THIẾT KẾ (DESIGN PHILOSOPHY):
# - Tránh xa lỗi "No artifacts named github-pages" của GitHub.
# - Sử dụng hành động peaceiris/actions-gh-pages v3 (Tiêu chuẩn vàng).
# - Đẩy trực tiếp toàn bộ code lên nhánh 'gh-pages'.
# =====================================================================

name: Deploy to GitHub Pages

# =====================================================================
# 1. ĐIỀU KIỆN KÍCH HOẠT (TRIGGERS)
# =====================================================================
on:
  push:
    branches: [ "main" ]
  
  # Cho phép chạy thủ công từ tab Actions
  workflow_dispatch:

# =====================================================================
# 2. QUYỀN HẠN CỦA BOT (PERMISSIONS)
# =====================================================================
# Bắt buộc phải có quyền "write" để bot có thể đẩy code lên nhánh gh-pages
permissions:
  contents: write 

# =====================================================================
# 3. QUẢN LÝ XUNG ĐỘT (CONCURRENCY)
# =====================================================================
# Đảm bảo các lần deploy không chạy chồng chéo lên nhau
concurrency:
  group: "gh-pages-deploy"
  cancel-in-progress: false 

# =====================================================================
# 4. CÁC BƯỚC THỰC THI (JOBS)
# =====================================================================
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10 
    
    steps:
      # -----------------------------------------------------------------
      # BƯỚC 1: LẤY CODE TỪ KHO VỀ MÁY ẢO
      # -----------------------------------------------------------------
      - name: 1. Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # -----------------------------------------------------------------
      # BƯỚC 2: TẠO FILE .NOJEKYLL
      # -----------------------------------------------------------------
      # Ngăn GitHub Pages chạy Jekyll (giúp giữ nguyên cấu trúc thư mục)
      - name: 2. Create .nojekyll file
        run: touch .nojekyll

      # -----------------------------------------------------------------
      # BƯỚC 3: DEPLOY LÊN NHÁNH GH-PAGES (TRÁI TIM CỦA FILE NÀY)
      # -----------------------------------------------------------------
      - name: 3. Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ 
          publish_branch: gh-pages
          # force_orphan: true # Bỏ comment dòng này nếu muốn xóa lịch sử commit của nhánh gh-pages cho nhẹ
