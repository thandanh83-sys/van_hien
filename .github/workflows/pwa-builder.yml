name: PWA Validation
on: [push, workflow_dispatch]

concurrency:
  group: pwa-group
  cancel-in-progress: true

jobs:
  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PWA Builder
        uses: pwa-builder/pwa-action@v1
        with:
          url: https://<TÊN_GITHUB_CỦA_BẠN>.github.io/van_hien/
