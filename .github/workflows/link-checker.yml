name: Check Broken Links
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: link-check-group
  cancel-in-progress: true

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: ruzickap/action-my-broken-link-checker@v3
        with:
          url: https://<TÊN_GITHUB_CỦA_BẠN>.github.io/van_hien/
          cmd_params: '--exclude "mailto:*"'
