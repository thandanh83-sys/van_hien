name: Generate Sitemap
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: git-push-group
  cancel-in-progress: false

jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate Sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://<TÊN_GITHUB_CỦA_BẠN>.github.io/van_hien/
