# =====================================================================
# VĂN ĐẠO ENGINE - GITHUB ACTION: KIỂM TRA TOÀN VẸN DỮ LIỆU
# Tên file: .github/workflows/validate-data.yml
# Version: # =====================================================================
# VĂN ĐẠO ENGINE - GITHUB ACTION: KIỂM TRA TOÀN VẸN DỮ LIỆU
# Tên file: .github/workflows/validate-data.yml
# Version: 3.1.0 (Read-Only Guard + Fixed Paths Ignore)
# =====================================================================
name: Validate Data Integrity

on:
  push:
    paths:
      - 'data/data-*.json'
      - 'data/tac-pham/**'
      - 'data/tac-gia/**'
      - 'tools/validate_data.py'
    # Bỏ qua các file do bot tự sinh ra để tránh chạy thừa
    paths-ignore:
      - 'data/manifests/**'
  workflow_dispatch:

concurrency:
  group: validate-data
  cancel-in-progress: true

# Cấp quyền đọc tường minh (Bắt buộc với repo mới của GitHub)
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: '1. Checkout code'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
        
      - name: '2. Set up Python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: '3. Check Python syntax'
        run: python -m py_compile tools/validate_data.py

      - name: '4. Run Data Integrity Check'
        run: python tools/validate_data.py3.0.0 (Read-Only Guard + Summary + Precise Trigger)
# =====================================================================
# Tác giả: Văn Đạo
#
# TRIẾT LÝ THIẾT KẾ (DESIGN PHILOSOPHY):
#
# 1. NGƯỜI GÁC CỔNG KHÔNG GHI (The Read-Only Gatekeeper):
#    Bot này KHÔNG commit, KHÔNG push, KHÔNG sửa file. Nó chỉ đọc
#    (read-only) và kiểm tra. Mục đích duy nhất là phát hiện sớm các
#    lỗi dữ liệu (JSON hỏng, thiếu ID, đứt gãy Index ↔ Detail) trước
#    khi chúng được deploy lên mạng lưới tri thức.
#
# 2. CẢNH BÁO SỚM (Early Warning):
#    Chạy tự động mỗi khi có thay đổi trong thư mục data/ (nhưng
#    KHÔNG chạy khi chỉ có 2 file manifest thay đổi — vì manifest
#    được bot khác sinh ra, không phải nguồn sự thật dữ liệu).
#    Nếu dữ liệu có lỗi nghiêm trọng → bot báo ĐỎ (Fail) ngay để
#    bạn biết mà sửa, tránh user đọc phải trang trắng.
#
# 3. KỶ LUẬT XẾP HÀNG (Concurrency):
#    Dùng group RIÊNG "validate-data" — KHÔNG dùng chung "git-push-group".
#    Lý do: bot này chỉ đọc, chạy song song với bot commit/deploy
#    không gây xung đột Git. Tách group giúp validate không phải đợi
#    các bot commit đang chạy (vài phút) — tiết kiệm CI.
#
# 4. QUYỀN TỐI THIỂU (Least Privilege - v3.0.0):
#    Đặt `permissions: contents: read` tường minh. Từ 2023, GitHub
#    khuyến nghị mọi repo dùng "Read-only GITHUB_TOKEN" mặc định.
#    Nếu KHÔNG khai báo, job có thể fail với lỗi permission ngay cả
#    khi chỉ cần đọc (tùy setting của repo).
#
# 5. BÁO CÁO TRỰC QUAN (Summary - v3.0.0):
#    Ghi báo cáo lên $GITHUB_STEP_SUMMARY để xem kết quả ngay trên
#    trang Actions, không cần scroll qua hàng trăm dòng log.
#
# 6. TRIGGER CHÍNH XÁC (Precise Trigger - v3.0.0):
#    Dùng cả `paths` + `paths-ignore` để:
#      - Chạy khi: data/data-*.json, data/tac-pham/, data/tac-gia/,
#        data/manifests/node-*.json thay đổi.
#      - KHÔNG chạy khi: chỉ 2 file static-assets.json và
#        agents-manifest.json thay đổi (do bot khác sinh, không phải
#        nguồn sự thật dữ liệu).
#
# LỊCH SỬ PHIÊN BẢN:
#   v2.0.0: Gatekeeper cơ bản, group riêng, chạy trên data/**.
#   v3.0.0: + permissions: contents: read (bắt buộc với repo mới)
#           + paths-ignore để loại nhiễu từ manifest bot sinh
#           + Summary trên giao diện Actions
#           + Bước verify environment để dễ debug
#           + Comment giải thích tại sao group tách riêng
# =====================================================================

name: Validate Data Integrity

# =====================================================================
# 1. ĐIỀU KIỆN KÍCH HOẠT (TRIGGERS)
# =====================================================================
on:
  push:
    # -----------------------------------------------------------------
    # 1.1. PATHS — Khi nào cần chạy?
    # -----------------------------------------------------------------
    # Dùng `data/**` để cover toàn bộ thư mục data/. Tuy nhiên, ta
    # dùng thêm `paths-ignore` (mục 1.2) để loại 2 file manifest do
    # bot khác sinh ra — vì chúng KHÔNG phải nguồn sự thật dữ liệu.
    #
    # `data/**` khớp:
    #   ✅ data/data-tac-pham.json       (index tác phẩm)
    #   ✅ data/data-tac-gia.json        (index tác giả)
    #   ✅ data/data-ly-thuyet.json      (index lý thuyết)
    #   ✅ data/data-tac-pham-master.json (file master chờ split)
    #   ✅ data/tac-pham/*.json          (detail tác phẩm)
    #   ✅ data/tac-gia/*.json           (detail tác giả)
    #   ✅ data/manifests/index.json     (graph node index)
    #   ✅ data/manifests/node-*.json    (graph nodes)
    #   ⚠️ data/manifests/static-assets.json  (sẽ bị ignore ở 1.2)
    #   ⚠️ data/manifests/agents-manifest.json (sẽ bị ignore ở 1.2)
    paths:
      - 'data/**'

      # Bản thân script kiểm tra bị thay đổi (để test lại logic)
      - 'tools/validate_data.py'

    # -----------------------------------------------------------------
    # 1.2. PATHS-IGNORE — Khi nào KHÔNG chạy?
    # -----------------------------------------------------------------
    # 2 file manifest dưới đây do `auto-update-manifests.yml` sinh ra.
    # Chúng KHÔNG phải nguồn sự thật dữ liệu — chỉ là danh sách file
    # tĩnh để Service Worker precache.
    # Nếu validate chạy mỗi khi 2 file này thay đổi:
    #   - Lãng phí CI (vài giây mỗi lần, nhưng vô nghĩa).
    #   - Có thể gây NHIỄU: khi bot vừa commit manifest mới, file
    #     index data-*.json có thể chưa kịp update → validate báo
    #     "mồ côi" sai sự thật.
    # Dùng `paths-ignore` để loại nhiễu này.
    paths-ignore:
      - 'data/manifests/static-assets.json'
      - 'data/manifests/agents-manifest.json'

  # Nút bấm thủ công để "Khám sức khỏe" toàn bộ dữ liệu bất cứ
  # lúc nào bạn muốn — không cần tạo commit giả.
  workflow_dispatch:

# =====================================================================
# 2. QUẢN LÝ XUNG ĐỘT (CONCURRENCY)
# =====================================================================
# Dùng một nhóm RIÊNG BIỆT, KHÔNG dùng chung "git-push-group".
#
# LÝ DO TÁCH RIÊNG:
# - Bot này chỉ ĐỌC (read-only), không GHI (write). Nó có thể chạy
#   song song với các bot khác (auto-split-works, auto-split-authors,
#   auto-update-manifests) mà KHÔNG sợ xung đột Git.
# - Nếu dùng chung "git-push-group", validate sẽ phải ĐỢI bot commit
#   đang chạy xong (có thể 5-15 phút) → trì hoãn phát hiện lỗi.
# - Group riêng "validate-data" cho phép validate chạy song song,
#   phát hiện lỗi nhanh hơn (fail-fast cho con người).
concurrency:
  group: validate-data

  # Nếu bạn push 2 lần liên tiếp, hủy lần kiểm tra cũ và chạy lần
  # mới nhất. An toàn vì bot chỉ đọc, không sợ dữ liệu "nửa nọ nửa kia".
  cancel-in-progress: true

# =====================================================================
# 3. QUYỀN HẠN CỦA BOT (PERMISSIONS) — v3.0.0
# =====================================================================
# NGUYÊN TẮC ĐẶC QUYỀN TỐI THIỂU (Principle of Least Privilege):
# Bot chỉ cần đọc nội dung repo. Không cần write, không cần pages,
# không cần issues. Khai báo tường minh để:
#   - Không bị fail khi repo bật "Read-only GITHUB_TOKEN".
#   - Rõ ràng với người review: bot này KHÔNG có quyền ghi.
permissions:
  contents: read

# =====================================================================
# 4. BIẾN MÔI TRƯỜNG DÙNG CHUNG
# =====================================================================
env:
  PYTHON_VERSION: '3.10'
  SCRIPT_PATH: 'tools/validate_data.py'

# =====================================================================
# 5. CÁC BƯỚC THỰC THI (JOBS)
# =====================================================================
jobs:
  validate:
    # Chạy trên máy ảo Ubuntu mới nhất của GitHub
    runs-on: ubuntu-latest

    # KỶ LUẬT THỜI GIAN: Tự động hủy nếu chạy quá 5 phút.
    # Script kiểm tra chỉ đọc file, không có tác vụ nặng. Nếu quá
    # 5 phút, chắc chắn có lỗi I/O hoặc file JSON bị lỗi vòng lặp.
    timeout-minutes: 5

    steps:
      # -----------------------------------------------------------------
      # BƯỚC 1: LẤY CODE MỚI NHẤT TỪ KHO VỀ MÁY ẢO
      # -----------------------------------------------------------------
      - name: '1. Checkout code (Lấy code về)'
        uses: actions/checkout@v4
        with:
          # Chỉ cần lấy code mới nhất (không cần lịch sử commit).
          # Điều này giúp bot khởi động nhanh hơn.
          fetch-depth: 1

      # -----------------------------------------------------------------
      # BƯỚC 2: CÀI ĐẶT MÔI TRƯỜNG PYTHON
      # -----------------------------------------------------------------
      - name: '2. Set up Python (Cài đặt Python)'
        uses: actions/setup-python@v5
        with:
          # Python 3.10 ổn định và tương thích tốt nhất với mọi
          # script trong tools/. Không cần cache pip vì script chỉ
          # dùng thư viện chuẩn (os, sys, json, pathlib).
          python-version: ${{ env.PYTHON_VERSION }}

      # -----------------------------------------------------------------
      # BƯỚC 3: VERIFY ENVIRONMENT (v3.0.0) — Kiểm tra môi trường
      # -----------------------------------------------------------------
      # In thông tin môi trường + cấu trúc thư mục data/ để dev xác
      # nhận đúng code đã checkout. Nếu fail ở bước sau, log này
      # giúp debug nhanh.
      - name: '3. Verify environment (Kiểm tra môi trường)'
        run: |
          echo "=== Thông tin môi trường ==="
          echo "Python: $(python --version 2>&1)"
          echo "Workspace: ${{ github.workspace }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"
          echo ""
          echo "=== Cấu trúc thư mục data/ ==="
          ls -la data/ || echo "⚠️ Chưa có thư mục data/"
          echo ""
          echo "=== Files trong data/tac-pham/ (nếu có) ==="
          ls -la data/tac-pham/ 2>/dev/null | head -n 10 || echo "(chưa có)"
          echo ""
          echo "=== Files trong data/tac-gia/ (nếu có) ==="
          ls -la data/tac-gia/ 2>/dev/null | head -n 10 || echo "(chưa có)"
          echo ""
          echo "=== Files trong tools/ ==="
          ls -la tools/ || echo "⚠️ Chưa có thư mục tools/"

      # -----------------------------------------------------------------
      # BƯỚC 4: KIỂM TRA CÚ PHÁP CỦA SCRIPT KIỂM TRA
      # -----------------------------------------------------------------
      # "Ai gác cổng thì cũng phải biết võ". Đảm bảo bản thân script
      # validate_data.py không bị lỗi cú pháp trước khi nó đi kiểm
      # tra người khác. Nếu lỗi, bước này báo đỏ ngay.
      - name: '4. Check Python syntax (Kiểm tra cú pháp)'
        run: |
          echo "=== Kiểm tra cú pháp ${{ env.SCRIPT_PATH }} ==="
          python -m py_compile "${{ env.SCRIPT_PATH }}"
          echo "✅ Cú pháp hợp lệ."

      # -----------------------------------------------------------------
      # BƯỚC 5: CHẠY SCRIPT KIỂM TRA (TRÁI TIM CỦA BOT)
      # -----------------------------------------------------------------
      # Script sẽ:
      #   1. Đọc data-tac-pham.json (index) → verify JSON, ID không
      #      trùng, có trường title.
      #   2. Đọc data/tac-pham/*.json (detail) → verify JSON, ID khớp
      #      tên file, không mồ côi (không có trong index).
      #   3. Đối chiếu Index ↔ Detail → phát hiện "đứt gãy liên kết".
      #   4. Lặp lại tương tự cho Tác giả.
      #
      # Nếu có LỖI NGHIÊM TRỌNG (JSON hỏng, ID trùng, tên file không
      # khớp) → script exit code 1 → bước này ĐỎ → CHẶN DEPLOY.
      # Nếu chỉ có CẢNH BÁO (mồ côi, thiếu detail) → script exit 0 →
      # vẫn cho qua, nhưng ghi log để bạn xem lại.
      - name: '5. Run Data Integrity Check (Khám sức khỏe dữ liệu)'
        id: validate
        run: |
          echo "=== Bắt đầu kiểm tra toàn vẹn dữ liệu ==="
          python "${{ env.SCRIPT_PATH }}"
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo ""
          echo "=== Kết thúc kiểm tra (exit code: $EXIT_CODE) ==="
          exit $EXIT_CODE

      # -----------------------------------------------------------------
      # BƯỚC 6: TÓM TẮT TRÊN GIAO DIỆN ACTIONS (v3.0.0)
      # -----------------------------------------------------------------
      # Ghi báo cáo trực quan lên $GITHUB_STEP_SUMMARY. Chạy BẤT KỂ
      # job thành công hay thất bại (if: always()) để dev luôn thấy
      # báo cáo cuối cùng.
      - name: '6. Summary (Báo cáo trên giao diện Actions)'
        if: always()
        run: |
          {
            echo "## 🛡️ Văn Đạo Data Integrity Check"
            echo ""
            echo "| Hạng mục | Giá trị |"
            echo "|---|---|"
            echo "| Trạng thái | \`${{ job.status }}\` |"
            echo "| Exit code | \`${{ steps.validate.outputs.exit_code || 'N/A' }}\` |"
            echo "| Commit SHA | \`${{ github.sha }}\` |"
            echo "| Người kích hoạt | @${{ github.actor }} |"
            echo "| Trigger bởi | \`${{ github.event_name }}\` |"
            echo "| Script | \`${{ env.SCRIPT_PATH }}\` |"
            echo ""
            echo "### Diễn giải kết quả"
            echo ""
            if [ "${{ steps.validate.outputs.exit_code }}" = "0" ]; then
              echo "✅ **Dữ liệu hợp lệ.** Không có lỗi nghiêm trọng. Deploy được phép tiếp tục."
              echo ""
              echo "> Nếu vẫn còn CẢNH BÁO trong log (mồ côi, thiếu detail), nên xem lại để mạng lưới hoàn hảo hơn."
            elif [ "${{ steps.validate.outputs.exit_code }}" = "1" ]; then
              echo "❌ **DỮ LIỆU KHÔNG HỢP LỆ.** Có lỗi nghiêm trọng cần sửa trước khi deploy."
              echo ""
              echo "**Hành động cần làm:**"
              echo "1. Mở log bước 5 để xem chi tiết lỗi."
              echo "2. Sửa lỗi trong file JSON tương ứng."
              echo "3. Push lại để bot chạy lại."
              echo ""
              echo "> ⚠️ Deploy có thể vẫn chạy (nếu workflow deploy không phụ thuộc validate), nhưng trang web có thể hiển thị sai."
            else
              echo "⚠️ **Không xác định được exit code** — có thể bước 5 chưa chạy (bị skip)."
            fi
          } >> $GITHUB_STEP_SUMMARY
