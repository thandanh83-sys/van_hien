# =====================================================================
# VĂN ĐẠO ENGINE - GITHUB ACTION: TỰ ĐỘNG TÁCH DỮ LIỆU TÁC PHẨM
# =====================================================================

name: Auto Split Works Data

on:
  push:
    paths:
      # Chỉ chạy khi file Master này bị thay đổi (thêm mới hoặc xóa)
      - 'data/data-tac-pham-master.json'
  workflow_dispatch:

concurrency:
  group: git-push-group
  cancel-in-progress: false

jobs:
  split:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      # BƯỚC 1: Lấy code mới nhất từ kho về máy ảo
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # BƯỚC 2: Cài đặt môi trường Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # BƯỚC 3: Chạy file Python để tách dữ liệu và xóa file Master
      - name: Run split script
        run: python tools/split_works.py

      # BƯỚC 4: Kiểm tra xem có file mới được tạo ra không
      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code || echo "changes=true" >> $GITHUB_OUTPUT

      # BƯỚC 5: Tự động Commit và Push (Chỉ chạy nếu Bước 4 báo có thay đổi)
      - name: Commit and Push with Retry
        if: steps.git-check.outputs.changes == 'true'
        uses: EndBug/add-and-commit@v11
        with:
          # ĐÃ XÓA [skip ci] để bot Deploy có thể nhận diện và đẩy lên Web ngay lập tức
          message: "chore: auto-split data and update index"
          push_attempts: 5 
          default_author: github_actions
