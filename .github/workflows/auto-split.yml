# =====================================================================
# VĂN ĐẠO ENGINE - GITHUB ACTION: TỰ ĐỘNG TÁCH DỮ LIỆU TÁC PHẨM
# Tác giả: Văn Đạo
# Mô tả: 
# - Kích hoạt khi có thay đổi ở file 'data/data-tac-pham-master.json'.
# - Tự động chạy script Python để tách file và nối vào Index.
# - Tự động Commit và Push kết quả với cơ chế thử lại (Retry) nếu mạng lag.
# =====================================================================

name: Auto Split Works Data

# 1. ĐIỀU KIỆN KÍCH HOẠT (TRIGGERS)
on:
  push:
    paths:
      # Chỉ chạy khi file Master này bị thay đổi
      - 'data/data-tac-pham-master.json'
  # Thêm nút bấm chạy thủ công trên giao diện GitHub nếu bạn cần test
  workflow_dispatch:

# 2. QUẢN LÝ XUNG ĐỘT (CONCURRENCY)
# Đảm bảo bot này không chạy cùng lúc với bot deploy hay các bot khác
concurrency:
  group: git-push-group
  cancel-in-progress: false

# 3. CÁC BƯỚC THỰC THI (JOBS)
jobs:
  split:
    runs-on: ubuntu-latest
    
    # Cấp quyền cho bot được phép ghi (Commit) dữ liệu vào kho code
    permissions:
      contents: write
      
    steps:
      # BƯỚC 1: Lấy code mới nhất từ kho về máy ảo
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Lấy toàn bộ lịch sử để tránh lỗi commit

      # BƯỚC 2: Cài đặt môi trường Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # BƯỚC 3: Chạy file Python để tách dữ liệu
      - name: Run split script
        run: python tools/split_works.py

      # BƯỚC 4: Tự động Commit và Push (Có cơ chế tự động thử lại)
      - name: Commit and Push with Retry
        uses: EndBug/add-and-commit@v11
        with:
          # Tin nhắn commit. [skip ci] giúp tránh việc bot tự kích hoạt lại chính nó (vòng lặp vô tận)
          message: "chore: auto-split data [skip ci]"
          # Tự động thử lại 5 lần nếu việc Push bị lỗi do xung đột mạng
          push_attempts: 5 
          # Tác giả của commit tự động
          default_author: github_actions
