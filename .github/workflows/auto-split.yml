name: Auto Split Works Data
on:
  push:
    paths:
      - 'data/data-tac-pham-master.json'
  workflow_dispatch:

concurrency:
  group: git-push-group
  cancel-in-progress: false

jobs:
  split:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Run split script
        run: python tools/split_works.py
      - name: Commit and Push with Retry
        uses: EndBug/add-and-commit@v11
        with:
          message: "chore: auto-split data [skip ci]"
          push_attempts: 5
          default_author: github_actions
